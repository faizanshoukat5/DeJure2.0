# Netlify configuration for DeJure React app
# Deploys the React app located in the `client` folder.

[build]
  base = "client"
  publish = "build"
  command = "npm run build"

[build.environment]
  # Node 16 is EOL and is no longer installable on Netlify's Ubuntu Noble build
  # image, which would fail the build outright. Node 20 LTS builds this app fine.
  NODE_VERSION = "20"
  # CI=false keeps CRA from treating lint warnings as build errors.
  CI = "false"

# Long-cache the fingerprinted CRA bundles; they get a new filename on every build.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Ensure single-page app routing works correctly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production environment overrides (optional)
[context.production.environment]
  NODE_ENV = "production"
